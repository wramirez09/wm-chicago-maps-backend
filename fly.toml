# fly.toml for the API. Lives at the repo root so the Docker build context
# includes packages/. Deploy: `pnpm fly:deploy` (= flyctl deploy --remote-only).
app = "chicago-api"
primary_region = "ord"

[build]
  dockerfile = "apps/api/Dockerfile"

[deploy]
  release_command = "node dist/migrate.js"
  strategy = "rolling"

[env]
  NODE_ENV = "production"
  LOG_LEVEL = "info"
  PORT = "3000"
  PHOTON_URL = "http://chicago-photon.flycast"
  VALHALLA_URL = "http://chicago-valhalla.flycast"

# Everything else (DATABASE_URL, JWT_SECRET, upstream keys) is `fly secrets set`.

[processes]
  web = "node dist/index.js"
  worker = "node dist/worker.js"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "suspend"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["web"]

  [[http_service.checks]]
    grace_period = "15s"
    interval = "30s"
    method = "GET"
    path = "/v1/ready"
    timeout = "5s"

[[vm]]
  processes = ["web"]
  size = "shared-cpu-1x"
  memory = "512mb"

[[vm]]
  processes = ["worker"]
  size = "shared-cpu-1x"
  memory = "512mb"
