app = "chicago-photon"
primary_region = "ord"

[build]
  dockerfile = "Dockerfile"

[mounts]
  source = "photon_data"
  destination = "/photon/photon_data"
  initial_size = "5gb"

# Private only: reached by the API over Flycast (http://chicago-photon.flycast).
# No [http_service] block on purpose. Allocate the private IP once:
#   flyctl ips allocate-v6 --private --app chicago-photon
[[services]]
  internal_port = 2322
  protocol = "tcp"
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  size = "shared-cpu-2x"
  memory = "2gb"
