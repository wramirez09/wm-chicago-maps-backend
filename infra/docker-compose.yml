# Whole backend in containers:
#   docker compose -f infra/docker-compose.yml up --build
# → PostGIS, migrations, API on :3000 (/docs), job worker.
# Photon/Valhalla are opt-in (`--profile geo`) and need a one-time data build: fly/build-data.md.
#
# For day-to-day dev you can instead run only the db here and use `pnpm dev` on the host.
services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: chicago
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d chicago"]
      interval: 5s
      retries: 10

  migrate:
    build: &api-build
      context: ..
      dockerfile: apps/api/Dockerfile
    image: wm-chicago-maps-api:local
    command: ["node", "dist/migrate.js"]
    environment: &api-env
      NODE_ENV: production
      LOG_LEVEL: info
      DATABASE_URL: postgres://postgres:postgres@db:5432/chicago
      DATABASE_URL_DIRECT: postgres://postgres:postgres@db:5432/chicago
      JWT_SECRET: ${JWT_SECRET:-local-dev-only-secret-local-dev-only-secret}
      # Local dev default is the public Photon instance (fair use only). Set PHOTON_URL=http://photon:2322
      # once the self-hosted index exists (`--profile geo`, fly/build-data.md).
      PHOTON_URL: ${PHOTON_URL:-https://photon.komoot.io}
      VALHALLA_URL: http://valhalla:8002
      CORS_ORIGINS: http://localhost:5173
    env_file:
      - path: ../apps/api/.env
        required: false
    depends_on:
      db: { condition: service_healthy }

  api:
    build: *api-build
    image: wm-chicago-maps-api:local
    command: ["node", "dist/index.js"]
    environment:
      <<: *api-env
      PORT: "3000"
    env_file:
      - path: ../apps/api/.env
        required: false
    ports: ["3000:3000"]
    depends_on:
      migrate: { condition: service_completed_successfully }
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:3000/v1/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 15s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  worker:
    build: *api-build
    image: wm-chicago-maps-api:local
    command: ["node", "dist/worker.js"]
    environment: *api-env
    env_file:
      - path: ../apps/api/.env
        required: false
    depends_on:
      migrate: { condition: service_completed_successfully }
    restart: unless-stopped

  photon:
    build: ./fly/chicago-photon
    ports: ["2322:2322"]
    volumes: ["./data/photon:/photon/photon_data"]
    profiles: ["geo"]

  valhalla:
    build: ./fly/chicago-valhalla
    ports: ["8002:8002"]
    volumes: ["./data/valhalla:/custom_files"]
    profiles: ["geo"]

volumes:
  pgdata:
